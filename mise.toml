[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt" }
"github:longbridge/nsh" = "0.5.1"

[tasks.fmt]
run = "cargo fmt --check"

[tasks.lint]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
run = "cargo test"

[tasks.build]
run = "cargo build --release"

[tasks.check]
depends = ["fmt", "lint", "test", "build"]

[tasks.dev]
description = "Run piro in the NSH terminal development host"
run = "nsh run --target tui"
