[package]
name = "piro"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"

[dependencies]
nsh-core = "0.5.1"
nsh-base = { version = "0.5.1", default-features = false }
nsh-platform-tui = { version = "0.5.1", default-features = false, features = ["run-app"] }
ratatui-core = "0.1.2"
ratatui-crossterm = "0.1.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
libc = "0.2.189"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2.5"
log = "0.4"

[dev-dependencies]
nsh-testing = { version = "0.5.1", default-features = false }
nsh-engine = "0.5.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
