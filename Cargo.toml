[package]
name = "tuitest"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "std"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
unicode-width = "0.2"
futures-util = { version = "0.3", default-features = false }
ansi-to-tui = "8.0.1"
tui-input = { version = "0.15.4", default-features = false, features = ["crossterm"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
